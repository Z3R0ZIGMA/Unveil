# Weekly pull requests for NuGet package and GitHub Actions updates. Security fixes come as soon as they are published
# (Dependabot security updates, turned on in the repository settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the .NET 10 (LTS) line: the 11.x packages need .NET 11.
      - dependency-name: System.*
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
