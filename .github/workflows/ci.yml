# Builds Unveil and runs the tests on every push to main and every pull request.
# Actions are pinned to a commit (the tag is in the comment), so a moved tag cannot change what runs here.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build Unveil.sln -c Release

      - name: Test
        run: dotnet test tests/Unveil.Core.Tests -c Release --no-build

      - name: N-sight script is plain ASCII and parses
        shell: pwsh
        run: |
          $path = 'rmm/Unveil-NSight.ps1'
          if ([IO.File]::ReadAllBytes($path) | Where-Object { $_ -gt 127 }) { throw "$path must be plain ASCII (N-sight runs it as uploaded)" }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
